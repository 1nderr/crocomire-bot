# ’
mrgameandwatch:
  title: Ridley vs Mr. Game & Watch
  overview: This MU is a test of patience for Ridley. Mr. Game & Watch has amazing defensive options with an amazing advantage state and pretty decent tools to get out of disadvantage but weak approach options. Neutral is a game of footises / outspacing with moves such as Ftilt/Dtilt/Nair. Keep your calm, play campy, and you should be fine.
  criticaltips:
    - Kill confirms to look out for are Chef>Ftilt, Drag down Nair>Ftilt/Dtilt.
    - Bucket confirms to look out for are Nair/Jab 1/Up B/Fair/Utilt/Dthrow.
    - Do not shield Fair as it's super safe on block, instead throw out a hitbox.
    - Usmash has full body invincibility on frames 21-25.
    - Up B is invincible on frames 5-13.
    - G&W's Dtilt only hits grounded opponents.
    - G&W Lacks a reliable kill throw so shield is good at higher %s.
    - You can partially fill bucket to make G&W unable to tank a full stream.
    - Ridley can Up B through chef.
    - Utilt Uair % = FH Uair 73-77% | FH DJ (78-88%)
  counterpicks: Kalos, T&C
  bans: Yoshi's Story, Battlefield
  image: https://vignette.wikia.nocookie.net/ssb/images/8/8c/Mr._Game_%26_Watch_-_Super_Smash_Bros._Ultimate.png/revision/latest?cb=20180612205002
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.nmzbkzazs7ca

ness:
  title: Ridley vs Ness
  overview: This MU is more annoying than anything else. Ness has better air mobility and frame data, but you have better ground mobility and range. Neutral is an intense dance of baiting whiffs and staying out of Ness' range. This is decided mostly by keeping advantage. Don't rush in and watch out for Ness' tricks!
  criticaltips:
    - Beat Yo-Yo at ledge by holding down during Wing Blitz.
    - Hit the PK Thunder lightning ball with nair/fair to get rid of it.
    - You can often punish Ness for absorbing plasma offstage with a fair/nair.
    - Release plasma early to feint an edgeguard and trick Ness into down b.
    - Utilt Uair %s = FH 86-89% | FH DJ 90-100%
  counterpicks: Lylat
  bans: Smashville
  image: https://vignette.wikia.nocookie.net/characterprofile/images/8/82/Ness_SSBU.png/revision/latest/scale-to-width-down/340?cb=20180617111739
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.arw6872htqt4

ridley:
  title: Ridley vs Purple Charizard
  overview: You've made a grave mistake, there's no turning back now. Never has a character been so perfectly designed to hard counter themself. The results screen means nothing, if there's no style there's no true winner.
  criticaltips:
    - Nair the most.
    - Don't nair the least.
    - Use Ftilt out of SPR mash release, unless they also Ftilt. Then use Dtilt.
    - Utilt Uair kill %s = FH (92-99%) | FH DJ (100-107%)
    - Down taunt everytime you put them offstage to trick that stupid ledge camping Ridley to actually use a getup already I SWEAR TO GOD I CANT HIT THIS GUY PLEASE JUST LET ME TRAP YOU.
  counterpicks: NORFAIR WITH VS RIDLEY MUSIC
  bans: BAN HERO FROM COMPETITIVE RULESETS!!!!
  image: https://www.smashbros.com/assets_v2/img/fighter/ridley/main2.png
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.x67rhpfwc5t5

yoshi:
  title: Ridley vs Yoshi
  overview: Neutral consists of stuffing-out Yoshi's approaches and overextensions with superior hitboxes and clever positioning to set up punishes. Hang slightly back, shield deliberately, then follow up with low-commitment options like f-tilt and nair to rack up chip damage or gain stage control, and finish stocks with movement callouts, ledge pressure, or edgeguards.
  criticaltips:
    - Yoshi DJ armor is from frame 1 - 44, ending at the apex of the jump.
    - Ridley's non-jab grounded attacks all break it past 86% with no rage.
    - Ridley's aerial attacks all break it past 105% with no rage.
    - Ftilt and nair beat every hitbox Yoshi has except tongue grabs.
    - Ridley's only safe-on-shield attacks are spaced f-tilt/d-tilt.
    - All of Yoshi's aerials can cross up shield when at full airspeed.
    - Save jumps for a fastfall starter for recovery or timing mixups.
    - Fair spike to upair/upsmash - 116%, 92%.
    - Dtilt to d/fsmash - 114% (109% w/jab lock), 78% (73% w/jab lock).
    - Dtilt or Jab1>Jab2 at ledge into run-off fair spike - 55% (all stages).
    - Utilt Uair %s = FH 91 - 96%, FH DJ 97 - 103%
  counterpicks: Kalos, Lylat
  bans: Battlefield, Yoshi's Story
  image: https://vignette.wikia.nocookie.net/yoshi/images/8/8d/Yoshi_SSBU.png/revision/latest/scale-to-width-down/340?cb=20180628045711
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.yvgydmt2zypv
