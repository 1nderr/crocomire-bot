yoshi:
  title: Ridley vs Yoshi
  overview: Neutral consists of stuffing-out Yoshi's approaches and overextensions with superior hitboxes and clever positioning to set up punishes. Hang slightly back, shield deliberately, then follow up with low-commitment options like f-tilt and nair to rack up chip damage or gain stage control, and finish stocks with movement callouts, ledge pressure, or edgeguards.
  criticaltips:
    - Yoshi DJ armor is from frame 1 - 44, ending at the apex of the jump.
    - Ridley's non-jab grounded attacks all break it past 86% with no rage.
    - Ridley's aerial attacks all break it past 105% with no rage.
    - Ftilt and nair beat every hitbox Yoshi has except tongue grabs.
    - Ridley's only safe-on-shield attacks are spaced f-tilt/d-tilt.
    - All of Yoshi's aerials can cross up shield when at full airspeed.
    - Save jumps for a fastfall starter for recovery or timing mixups.
    - Fair spike to upair/upsmash - 116%, 92%.
    - Dtilt to d/fsmash - 114% (109% w/jab lock), 78% (73% w/jab lock).
    - Dtilt or Jab1>Jab2 at ledge into run-off fair spike - 55% (all stages).
    - Utilt Uair %s = FH 91 - 96% | FH DJ 97 - 103%
  counterpicks: Kalos, Lylat
  bans: Battlefield, Yoshi's Story
  image: https://vignette.wikia.nocookie.net/yoshi/images/8/8d/Yoshi_SSBU.png/revision/latest/scale-to-width-down/340?cb=20180628045711
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.yvgydmt2zypv

zerosuit:
  title: Ridley vs Zero Suit Samus
  overview: The ZSS matchup is one of patience. To win, it is key you get into the ZSS players mind, read and bait their options, and deliver a hard punish. It is one of mostly fundamentals, and player skill. Catching her jumps and overextensions with an Uptilt, Downtilt, Upsmash, or Ftilt is important for getting chip damage and leading into advantage.
  criticaltips:
    - Abuse Up smash and Uair against Flip kick.
    - Nair, Zair, and Blaster are her best combo moves and can lead to kills.
    - ZSS has hard to punish shield pressure but little shield dmg and poke.
    - ZSS loses her Flip jump after using it until she touches the ground.
    - ZSS has 2 tethers to recover with, edgeguard her quickly.
    - Fair and Nair are good for getting off the ledge.
    - ZSS can jump over Plasma with Flip jump, be careful with it.
    - ZSS has overall fast getup options. Read them, do not react to them.
    - Bait, read, and chase Flip jump to maintain advantage.
    - ZSS's rising airs on shield are tough to punish, but it's possible.
    - Parries help to deal with shield pressure, especially on rising airs.
    - Dsmash/Blaster > Boost kick kills around 90%.
    - Upthrow kills Ridley at around 185%+ (No DI, center BF)
    - Utilt Uair %s = FH:78-82% | FH DJ 83-86%
  counterpicks: Pokemon Stadium 2
  bans: Yoshi's Story, Kalos, Town & City, Battlefield, Smashville
  image: https://www.ssbwiki.com/images/5/59/Zero_Suit_Samus_SSB4.png
  link: https://docs.google.com/document/d/12hvAdoIZJvSPZbsx9NX4bxadupXLE2gM4JDNrSogkTo/edit#heading=h.jl28zp789230
