changes:
  title: Recent Ridley Changes (7.0.0)
  image: https://cdn.discordapp.com/emojis/562472805120344074.png?v=1
  fields:
    Shield 1: Made a part of the wing briefly invincible after activating/deactivating shield.
    Shield 2: Changed his posture while shielding to reduce vulnerability to a shield stab.

