changes:
  title: Recent Ridley Changes
  image: surprised.png
  fields:
    Up Smash: Hitbox duration increased from 12-16 to 12-17 and KBG increased 76 to 78. Can also hit more characters in the front.
    Bair: Damage increased from 15 to 16.
    Dair: Can no longer stall in the air.
    Uair: Hitbox size increased.
    Wing Blitz: Start up decreased on all directions by 3 frames. The travel speed was also increased.
    Space Pirate Rush: Throw knock back increased from 83 to 90. It kills around 20% earlier now. Also, jump cancel FAF decreased from 41 > 38 (air and ground).

