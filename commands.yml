help:
  title: Ridley Stats Commands
  image: croc.png
  fields:
      Prefix: "?"
      docs: Links the Ridleycord resources, lab, and guide docs.
      bruh: Says Bruh.
      changes: Displays Ridley's latest changes. (See more patches in the In-Depth Ridley Guide)
      help: Sends the user a list of commands.
      levels: Links the Ridleycord Mario Maker 2 level spreadsheet.
      meme: Sends a random Ridleycord meme.
      montage: Links the Ridleycord Montage.
      muchart: Displays the community MU chart.
      op: Links the Ridleycord anime opening.
      social: Links the Ridleycord social media.
      stats [move]: Displays an embedded message with a given move's stats. (Including Ridley's stats and taunts)
      viz [move]: Displays an image of a given move. (Including taunts)
      vods: Links tournament and JMU vods.

